name: data-platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install runtime, RAG, and development dependencies
        run: uv sync --locked --extra rag --group dev
      - name: Check provider contract drift
        run: uv run --locked --extra rag python tools/check_contract_drift.py
      - name: Lint
        run: uv run --locked --extra rag ruff check law_repository/src law_repository/tests evals tools
      - name: Typecheck
        run: uv run --locked --extra rag mypy
      - name: Run representative offline regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --extra rag pytest -q \
            evals/tests \
            law_repository/tests/test_provider_contract.py \
            law_repository/tests/test_provider_identity.py \
            law_repository/tests/test_evidence_http_contract.py \
            law_repository/tests/test_evidence_v3.py \
            law_repository/tests/test_requirement_policy_release.py \
            law_repository/tests/test_runtime_v3_service.py \
            law_repository/tests/test_three_law_v3_scenario_eval.py \
            law_repository/tests/test_model_identity.py \
            law_repository/tests/test_hf_space_deploy.py
