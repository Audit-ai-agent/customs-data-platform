name: data-platform-ci

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"
      - ".gitignore"
      - "pyproject.toml"
      - "uv.lock"
      - "contracts/**"
      - "law_repository/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"
      - ".gitignore"
      - "pyproject.toml"
      - "uv.lock"
      - "contracts/**"
      - "law_repository/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: data-platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --extra store --extra rag --extra ingestion
      - name: Check Evidence V3 contract drift
        run: uv run --locked --no-sync --group dev python tools/check_contract_drift.py
      - name: Lint
        run: uv run --locked --no-sync --group dev ruff check law_repository/src law_repository/tests tools
      - name: Typecheck
        run: uv run --locked --no-sync --group dev mypy
      - name: Run local profile and contract regressions
        run: uv run --locked --no-sync --group dev pytest -q
      - name: Scan tracked source with redacted Gitleaks output
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status -
          tar -xzf "$archive" gitleaks
          scan_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$scan_root"
          ./gitleaks dir "$scan_root" --config .gitleaks.toml --redact --no-banner --exit-code 1
