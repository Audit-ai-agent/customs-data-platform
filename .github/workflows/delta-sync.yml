# Legacy mutable delta sync is intentionally fail-closed.
#
# The preserved legacy delta implementation updates active PostgreSQL and
# Qdrant state in place and does not build/seal/promote one immutable V3
# generation across PostgreSQL, Qdrant, and Neo4j. Running it with production
# credentials would therefore bypass the Evidence V3 release invariant. The
# implementation remains in Git history for team provenance, but this workflow
# must not receive credentials or execute mutations. A future replacement must
# use the locked environment and the V3 new-generation builder/release Gate.
name: legacy-delta-sync-disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse mutable legacy sync
        shell: bash
        run: |
          echo "::error::Legacy active-store delta sync is disabled. Build, validate, seal, and promote a new Evidence V3 generation instead."
          exit 1
