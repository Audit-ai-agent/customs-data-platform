[project]
name = "customs-data-platform"
version = "0.1.0"
description = "Versioned Korean customs knowledge platform and Evidence API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "FlagEmbedding>=1.3",
  "neo4j>=5.24",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "qdrant-client>=1.15,<1.17",
  "requests>=2.32",
  "uvicorn>=0.30",
  "xmltodict>=0.13",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = [".", "law_repository"]
testpaths = ["law_repository/tests", "evals/tests"]
markers = [
  "live: requires initialized PostgreSQL, Qdrant, and Neo4j services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["law_repository"]
files = [
  "law_repository/src/deadline.py",
  "law_repository/src/process_ipc.py",
  "law_repository/src/process_security.py",
  "law_repository/src/process_start.py",
  "law_repository/src/model_runtime.py",
  "law_repository/src/neo4j_runtime.py",
  "law_repository/src/production.py",
  "law_repository/src/production_settings.py",
  "law_repository/src/runtime_api.py",
  "law_repository/src/runtime_release.py",
  "law_repository/src/generation_evidence.py",
  "law_repository/src/generation_runtime.py",
  "law_repository/src/generation_stores.py",
  "law_repository/src/db/postgres.py",
  "law_repository/src/db/qdrant.py",
  "law_repository/src/db/neo4j.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
