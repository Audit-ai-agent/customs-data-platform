[project]
name = "customs-data-platform"
version = "0.1.0"
description = "Versioned Korean customs knowledge platform and Evidence API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.5,<3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
store = [
  "neo4j>=5.24",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "qdrant-client>=1.15,<1.17",
]
rag = [
  "FlagEmbedding>=1.3",
  "huggingface-hub>=0.23,<2",
  "numpy>=1.26,<3",
  "torch>=2.0",
]
ingestion = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "requests>=2.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy==1.17.1",
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = [".", "law_repository"]
testpaths = [
  "law_repository/tests/test_evidence.py",
  "law_repository/tests/test_ccct_p0.py",
  "law_repository/tests/test_hsk_ccct_history.py",
  "law_repository/tests/test_evidence_v3.py",
  "law_repository/tests/test_evidence_v3_contract.py",
  "law_repository/tests/test_guidance_v3.py",
  "law_repository/tests/test_guidance_v2.py",
  "law_repository/tests/test_profile_evidence.py",
  "law_repository/tests/test_local_compose_security.py",
  "law_repository/tests/test_migration_runner.py",
  "law_repository/tests/test_law_history.py",
  "law_repository/tests/test_model_identity.py",
  "law_repository/tests/test_github_workflow_security.py",
  "law_repository/tests/test_bm25.py",
  "law_repository/tests/test_graph_unit.py",
  "law_repository/tests/test_hybrid_unit.py",
  "law_repository/tests/test_lawgo_security.py",
  "law_repository/tests/test_repository_unit.py",
  "law_repository/tests/test_store_consistency.py",
]
markers = [
  "live: requires initialized PostgreSQL, Qdrant, and Neo4j services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["law_repository"]
files = [
  "law_repository/scripts/migrate.py",
  "law_repository/src/config.py",
  "law_repository/src/conformance.py",
  "law_repository/src/evidence.py",
  "law_repository/src/evidence_v3.py",
  "law_repository/src/hsk_ccct_history.py",
  "law_repository/src/guidance_registry.py",
  "law_repository/src/guidance_registry_v2.py",
  "law_repository/src/guidance_v3.py",
  "law_repository/src/functional_uat.py",
  "law_repository/src/law_history.py",
  "law_repository/src/law_history_benchmark.py",
  "law_repository/src/functional_uat_kr_trade.py",
  "law_repository/src/functional_uat_kr_trade_v2.py",
  "law_repository/src/ingest/laws.py",
  "law_repository/src/local_profiles.py",
  "law_repository/src/profile_evidence.py",
  "law_repository/src/profile_wire.py",
  "law_repository/src/store_consistency.py",
  "law_repository/src/db/postgres.py",
  "law_repository/src/db/qdrant.py",
  "law_repository/src/db/neo4j.py",
  "tools/generate_evidence_v3_contracts.py",
  "tools/check_contract_drift.py",
  "tools/dev_store.py",
  "tools/functional_uat_3law.py",
  "tools/functional_uat_law_history.py",
  "tools/hsk_ccct_archive.py",
  "tools/functional_uat_kr_trade.py",
  "tools/benchmark_law_history_retrieval.py",
  "tools/run_dev_fixture_evidence.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
