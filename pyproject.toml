[project]
name = "customs-data-platform"
version = "0.1.0"
description = "Versioned Korean customs knowledge platform and Evidence API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115",
  "neo4j>=5.24",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "qdrant-client>=1.15,<1.17",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
rag = [
  "aiohttp>=3.14.3,<4",
  "FlagEmbedding>=1.3",
  "numpy>=1.26,<3",
  "torch>=2.0",
]
ingestion = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "requests>=2.32",
  "xmltodict>=0.13",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = [".", "law_repository"]
testpaths = ["law_repository/tests", "evals/tests"]
markers = [
  "live: requires initialized PostgreSQL, Qdrant, and Neo4j services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["law_repository"]
files = [
  "law_repository/src/deadline.py",
  "law_repository/src/process_ipc.py",
  "law_repository/src/process_security.py",
  "law_repository/src/process_start.py",
  "law_repository/src/model_runtime.py",
  "law_repository/src/neo4j_runtime.py",
  "law_repository/src/runtime_service.py",
  "law_repository/src/runtime_settings.py",
  "law_repository/src/runtime_api.py",
  "law_repository/src/runtime_release.py",
  "law_repository/src/evidence_v3.py",
  "law_repository/src/requirement_policy_release.py",
  "law_repository/src/runtime_release_v3.py",
  "law_repository/src/runtime_api_v3.py",
  "law_repository/src/generation_evidence.py",
  "law_repository/src/generation_runtime.py",
  "law_repository/src/generation_stores.py",
  "law_repository/src/db/postgres.py",
  "law_repository/src/db/qdrant.py",
  "law_repository/src/db/neo4j.py",
  "tools/run_evidence_v2_conformance_server.py",
  "tools/run_evidence_v3_conformance_server.py",
  "tools/test_only_v3_policy.py",
  "tools/generate_evidence_v3_contracts.py",
  "tools/run_preserved_data_v2_diagnostic.py",
  "tools/run_three_law_v3_diagnostic.py",
  "tools/run_three_law_v3_scenario_eval.py",
  "tools/scenario_eval_v3_policy.py",
  "tools/build_provider_context.py",
  "tools/provider_context.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
