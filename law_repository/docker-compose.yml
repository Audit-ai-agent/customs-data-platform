# 3-스토어: Postgres(시간버전 원장) / Qdrant(현행 인덱스) / Neo4j(그래프)
# 실행: profile별 `docker compose --project-name ... --env-file <_local config> up -d --wait`
#
# `container_name`을 쓰지 않는다. Compose project name이 컨테이너·volume을
# 분리하므로 dev-store와 functional-uat-3law를 같은 PC에서 동시에 띄울 수 있다.
services:
  postgres:
    image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_doc}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run a local profile init command first}
    ports:
      # Host port is configurable so this stack never requires stopping an
      # unrelated local PostgreSQL instance. Container-to-container traffic
      # continues to use 5432.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade} -d ${POSTGRES_DB:-trade_doc}"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    # 서버사이드 IDF(sparse bm25 modifier=idf) 필요 → 1.15.2+ 핀
    image: qdrant/qdrant@sha256:6ac4807063bbecddca0250bfbcff52acf18c22263b904d12919349e6d0a408f1
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"   # REST
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run a local profile init command first}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474"]
      interval: 5s
      timeout: 5s
      retries: 18

volumes:
  pg_data:
    labels:
      com.customs.data.profile: ${CUSTOMS_DATA_PROFILE:-dev-store}
  qdrant_data:
    labels:
      com.customs.data.profile: ${CUSTOMS_DATA_PROFILE:-dev-store}
  neo4j_data:
    labels:
      com.customs.data.profile: ${CUSTOMS_DATA_PROFILE:-dev-store}
