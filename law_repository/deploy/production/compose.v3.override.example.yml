services:
  evidence:
    # Add this file after compose.example.yml only for the reviewed Evidence v3
    # production candidate. The v2 entrypoint remains available for rollback.
    command: ["python", "-m", "src.production_v3"]
    volumes:
      - type: bind
        source: ${EVIDENCE_REQUIREMENT_POLICY_RELEASE_FILE:?set reviewed absolute policy release path}
        target: /run/evidence-release/requirement-policy.json
        read_only: true
      - type: bind
        source: ${EVIDENCE_TRUSTED_REVIEWERS_FILE:?set image-pinned reviewer trust store path}
        target: /run/evidence-release/trusted-reviewers.json
        read_only: true
